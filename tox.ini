[tox]
envlist =
    pyroma
    ruff
    tests
requires = tox

[testenv:tests]
commands =
    pytest tests/
deps =
    pytest
    pyarrow
description = Run tests to check code validity. pyarrow is here because the
    corpus readers in scripts/ are tested too, and they read Parquet.

[testenv:pyroma]
commands =
    pyroma .
deps =
    pyroma
skip_install = true
description = Make sure pyproject.toml is properly written out.

[testenv:ruff]
skip_install = true
deps =
    ruff
commands =
    ruff check src tests scripts
    ruff format --check src tests scripts
description = Lint with Ruff (replaces flake8 + isort + pep8-naming + pydocstyle + bandit + bugbear + ...); config lives in pyproject.toml.
